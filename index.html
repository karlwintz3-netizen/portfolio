<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio — Accueil</title>
  <meta name="description" content="Portfolio de designer graphique : identité de marque, édition, typographie." />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <a class="lien-evitement" href="#contenu-principal">Aller au contenu principal</a>

  <main id="contenu-principal" class="tableau-liege tableau-liege--accueil">
    <nav aria-label="Rubriques du portfolio">
      <ul class="nav-postits">
        <li class="nav-postits__item">
          <a class="postit postit--violet" href="#">
            <span class="postit__texte">À propos</span>
          </a>
        </li>
        <li class="nav-postits__item">
          <button
            type="button"
            class="postit postit--bleu"
            id="bouton-identite"
            data-postit-toggle
            aria-expanded="false"
            aria-controls="sous-rubriques-identite"
          >
            <span class="postit__texte">Identité de marque</span>
            <span class="postit__icone" aria-hidden="true">▾</span>
          </button>

          <ul id="sous-rubriques-identite" class="sous-postits" data-categorie="identite" hidden></ul>
        </li>
        <li class="nav-postits__item">
          <button
            type="button"
            class="postit postit--rose"
            id="bouton-edition"
            data-postit-toggle
            aria-expanded="false"
            aria-controls="sous-rubriques-edition"
          >
            <span class="postit__texte">Édition</span>
            <span class="postit__icone" aria-hidden="true">▾</span>
          </button>

          <ul id="sous-rubriques-edition" class="sous-postits sous-postits--gauche" data-categorie="edition" hidden></ul>
        </li>
        <li class="nav-postits__item">
          <button
            type="button"
            class="postit postit--vert"
            id="bouton-typo"
            data-postit-toggle
            aria-expanded="false"
            aria-controls="sous-rubriques-typo"
          >
            <span class="postit__texte">Typographie</span>
            <span class="postit__icone" aria-hidden="true">▾</span>
          </button>

          <ul id="sous-rubriques-typo" class="sous-postits" data-categorie="typographie" hidden></ul>
        </li>
      </ul>
    </nav>
  </main>

  <script src="js/script.js"></script>
  <script src="js/accueil-projets.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
